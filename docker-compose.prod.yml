services:
  app:
    image: ${ECR_REPO}:${IMAGE_TAG:-latest}
    container_name: stock-manager
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - watchlist-data:/home/app/stock-watchlist
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: stock-nginx
    restart: unless-stopped
    # certbot 가 인증서를 자동 갱신해도 nginx 는 메모리에 로드한 옛 인증서를 계속 서빙한다.
    # 12시간마다 self-reload 하여 디스크의 갱신된 인증서를 자동 반영 (2026-07-31, 만료 재발 방지).
    # exec 로 nginx 를 PID1 에 배치 → SIGTERM(docker stop) 을 네이티브 graceful 처리. 검증 완료.
    command: ["sh", "-c", "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: stock-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  watchlist-data:
